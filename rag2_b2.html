<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2リーグ東地区 RAG (編集用)</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <h1>🏀 B2リーグ東地区 知識検索（編集用）</h1>
    <p>開発・編集用のページです。データや説明を確認できます。</p>

    <div class="bg-uploader" style="margin-top:12px">
        <label for="bg-input">背景を設定: </label>
        <input type="file" id="bg-input" accept="image/*">
        <button id="bg-clear" type="button">背景クリア</button>
        <div id="bg-preview" style="display:none"></div>
    </div>

    <div style="margin-bottom: 12px; margin-top:12px;">
        <input id="question" placeholder="例：青森ワッツの特徴は？" style="width:400px; padding:8px;">
        <button onclick="askRAG()">質問する</button>
    </div>

    <div id="rag-result"></div>

    <script src="js/bg-uploader.js"></script>
    <script src="js/config.js"></script>
    <script src="js/llm-client.js"></script>
    <script src="js/vector-search.js"></script>
    <script src="js/rag-system.js"></script>
    <script src="js/app-rag.js"></script>
</body>
</html>
